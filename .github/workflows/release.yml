name: Release Extension

# Runs whenever a tag like v1.0.0 is pushed
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # needed to create a release and upload assets

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Zip the extension
        run: |
          zip -r "yt-split-scroll-${{ steps.version.outputs.VERSION }}.zip" . \
            -x ".*" -x ".git/*" -x ".github/*"

      - name: Create GitHub Release with zip asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          files: yt-split-scroll-${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true
